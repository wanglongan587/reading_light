<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="iconBg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#1E352D"/>
      <stop offset="52%" stop-color="#142620"/>
      <stop offset="100%" stop-color="#0B1613"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="0.5" cy="0.38" r="0.46">
      <stop offset="0%" stop-color="#FFEBB3" stop-opacity="0.78"/>
      <stop offset="45%" stop-color="#8FD9A8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#142620" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7E3AF" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#76A888" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F7E3AF" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="pageLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9E8"/>
      <stop offset="100%" stop-color="#E7D4A7"/>
    </linearGradient>

    <linearGradient id="pageRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="100%" stop-color="#DFC896"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8DE0B2" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FFE8A3" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8DE0B2" stop-opacity="0.2"/>
    </linearGradient>

    <clipPath id="squircleClip">
      <rect x="20" y="20" width="472" height="472" rx="116"/>
    </clipPath>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <g clip-path="url(#squircleClip)">
    <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#iconBg)"/>
    <!-- Ambient Core Glow -->
    <circle cx="256" cy="204" r="200" fill="url(#coreGlow)"/>
  </g>
  <rect x="20" y="20" width="472" height="472" rx="116" fill="none" stroke="url(#rimStroke)" stroke-width="6"/>
  <!-- Inner Glass Specular Rim -->
  <rect x="34" y="34" width="444" height="444" rx="104" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12"/>

  <!-- Sonic / Radio Orbit Rings -->
  <g fill="none" stroke="#CBEAD5" stroke-linecap="round">
    <circle cx="256" cy="186" r="78" stroke-width="2" stroke-opacity="0.24" stroke-dasharray="6 12"/>
    <circle cx="256" cy="186" r="118" stroke-width="1.5" stroke-opacity="0.16"/>
  </g>

  <!-- Luminous Four-Point Star / Micro-Light Core -->
  <path d="M256,96 L267,142 L313,153 L267,164 L256,210 L245,164 L199,153 L245,142 Z" fill="#FFF7D6"/>
  <circle cx="256" cy="153" r="14" fill="#FFFFFF"/>

  <!-- Floating Bokeh Particles -->
  <circle cx="156" cy="148" r="5" fill="#FFE8A3" opacity="0.75"/>
  <circle cx="358" cy="140" r="6" fill="#9AE8C0" opacity="0.75"/>
  <circle cx="192" cy="104" r="3.5" fill="#FFF7D6" opacity="0.6"/>
  <circle cx="326" cy="106" r="4" fill="#FFF7D6" opacity="0.65"/>

  <!-- Acoustic Waveform Bars between Star & Open Book -->
  <g stroke="#FFE59E" stroke-width="4.5" stroke-linecap="round" opacity="0.82">
    <line x1="208" y1="216" x2="208" y2="228"/>
    <line x1="224" y1="208" x2="224" y2="234"/>
    <line x1="240" y1="200" x2="240" y2="240"/>
    <line x1="272" y1="200" x2="272" y2="240"/>
    <line x1="288" y1="208" x2="288" y2="234"/>
    <line x1="304" y1="216" x2="304" y2="228"/>
  </g>

  <!-- Sculptural Open Book Pages -->
  <!-- Lower Book Cover Base -->
  <path d="M98,274 C156,278 212,302 256,338 C300,302 356,278 414,274 L402,386 C348,386 298,404 256,434 C214,404 164,386 110,386 Z" fill="#3B5E4C" opacity="0.85"/>

  <!-- Left Page -->
  <path d="M110,244 C166,250 218,276 254,316 L254,418 C214,382 162,362 104,358 Z" fill="url(#pageLeft)"/>
  <!-- Right Page -->
  <path d="M402,244 C346,250 294,276 258,316 L258,418 C298,382 350,362 408,358 Z" fill="url(#pageRight)"/>

  <!-- Upper Riffled Page Accents -->
  <path d="M126,232 C176,242 220,268 256,304 C292,268 336,242 386,232" fill="none" stroke="url(#waveGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Center Spine Accent -->
  <rect x="252" y="310" width="8" height="112" rx="4" fill="#21382E"/>
</svg>
