<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' blob: 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; connect-src 'self'; frame-src blob: 'self'; object-src 'none'; base-uri blob: 'self'; form-action 'none'">
<title>微光 · 阅读</title><link rel="stylesheet" href="reader.css"></head>
<body>
<div id="reading-progress" aria-hidden="true"><span id="reading-progress-fill"></span></div>
<div id="paper-vignette" aria-hidden="true"></div>
<main id="reader" aria-label="电子书正文"></main>
<div id="warm-filter" aria-hidden="true"></div>
<div id="status" role="status">正在铺开这一页…</div>
<div id="selection-pill" role="toolbar" aria-label="选文微光工具条" hidden>
 <div class="hl-palette" role="group" aria-label="选择荧光笔颜色">
  <button class="hl-dot" type="button" data-color="amber" title="琥珀暖黄划线" aria-label="琥珀暖黄划线"></button>
  <button class="hl-dot" type="button" data-color="sage" title="苔藓微绿划线" aria-label="苔藓微绿划线"></button>
  <button class="hl-dot" type="button" data-color="rose" title="樱雾淡粉划线" aria-label="樱雾淡粉划线"></button>
  <button class="hl-dot" type="button" data-color="prism" title="棱镜暮紫划线" aria-label="棱镜暮紫划线"></button>
 </div>
 <span class="pill-sep" aria-hidden="true"></span>
 <button id="note-btn" class="pill-action" type="button" aria-label="添加随手批注">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg>
  <span>批注</span>
 </button>
 <button id="echo" class="pill-action" type="button" hidden aria-label="为选中的文字寻找回响">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.1L5 10l5.1 1.9L12 17l1.9-5.1L19 10l-5.1-1.9L12 3Z"/><path d="M5 3v4M3 5h4M19 17v4M17 19h4"/></svg>
  <span>回响</span>
 </button>
 <button id="copy-btn" class="pill-action" type="button" aria-label="复制摘录">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
  <span>复制</span>
 </button>
</div>
<script src="reader.js"></script>
</body></html>
