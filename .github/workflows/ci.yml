name: Desktop checks
on: [push, pull_request]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang cmake pkg-config libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan-dev libxcb-shape0-dev libxcb-xfixes0-dev fonts-noto-cjk
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: cargo fmt --all -- --check
      - run: cargo test -p glow-core --locked
      - run: cargo test -p glow-reading --features ui-test --locked
      - run: cargo build -p glow-reading --locked
      - run: cargo run -p glow-core --example fixtures -- target/fixtures
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}
          path: web/test-results/
