name: Release Desktop Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version override (defaults to Cargo.toml version)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
      - uses: Swatinem/rust-cache@v2
      - name: Package Windows ZIP & NSIS Installer
        shell: pwsh
        env:
          GLOW_SIGN_PFX_B64: ${{ secrets.GLOW_WIN_SIGN_PFX_B64 }}
          GLOW_SIGN_PASSWORD: ${{ secrets.GLOW_WIN_SIGN_PASSWORD }}
          GLOW_TIMESTAMP_URL: ${{ secrets.GLOW_WIN_TIMESTAMP_URL }}
        run: |
          if ($env:GLOW_SIGN_PFX_B64) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'glow-sign.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:GLOW_SIGN_PFX_B64))
            $env:GLOW_SIGN_PFX = $pfxPath
          }
          powershell -ExecutionPolicy Bypass -File scripts/package-windows.ps1 -BuildInstaller
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Package macOS DMG
        env:
          GLOW_MACOS_ARCH: ${{ matrix.arch }}
          GLOW_MACOS_TARGET: ${{ matrix.target }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256

  publish-draft-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate auto-update manifest (latest.json)
        env:
          GLOW_RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 scripts/generate-update-manifest.py release-artifacts
      - name: Publish Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" release-artifacts/* \
            --draft \
            --title "微光阅读 Glow Reading $TAG" \
            --generate-notes
